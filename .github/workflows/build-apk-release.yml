name: Build APK and publish releases

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/app-debug.apk release-files/LogCam.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogCam-apk
          path: release-files/LogCam.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LogCam ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/LogCam.apk
